<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marshrut: avtobus chiptalari</title>
<meta name="description" content="Shaharlararo va xalqaro avtobus chiptalari: reys qidirish, o'rin tanlash, onlayn to'lov, QR chipta.">
<meta name="theme-color" content="#0B3B31">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230B3B31'/%3E%3Cpath d='M7 20V11a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9z' fill='none' stroke='%23C8F135' stroke-width='2'/%3E%3Cpath d='M7 15h18' stroke='%23C8F135' stroke-width='2'/%3E%3Ccircle cx='11.5' cy='22' r='1.8' fill='%23C8F135'/%3E%3Ccircle cx='20.5' cy='22' r='1.8' fill='%23C8F135'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#10201B; --muted:#55645F; --bg:#F2F5F1; --card:#fff; --line:#DCE3DE;
  --brand:#0B3B31; --brand-2:#14584A; --lime:#C8F135; --lime-d:#A9D41C;
  --coral:#E4572E; --warn:#B4540A; --ok:#0E7A5F; --ok-bg:#DDF3EA;
  --male:#CFE0FF; --male-b:#4B79D8; --fem:#FFD3E2; --fem-b:#D9497F;
  --r:16px; --shadow:0 1px 2px rgba(16,32,27,.06),0 8px 24px rgba(16,32,27,.06);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}
.sr,.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;background:#fff;padding:8px 12px;border-radius:8px;z-index:100}
:focus-visible{outline:3px solid #6AA3FF;outline-offset:2px}

/* header */
.top{background:var(--brand);color:#fff;position:sticky;top:0;z-index:30}
.top-in{display:flex;align-items:center;gap:20px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:19px;letter-spacing:-.01em}
.nav{display:flex;gap:4px;margin-left:12px}
.nav a{padding:8px 14px;border-radius:10px;text-decoration:none;color:#BFD3CC;font-weight:600;font-size:15px}
.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav a.on{color:#fff;background:rgba(255,255,255,.14)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.bell{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:#BFD3CC}
.bell:hover,.bell.on{color:#fff;background:rgba(255,255,255,.12)}
.lang{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:10px;height:40px;padding:0 8px}
.lang option{color:#000}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--brand);display:grid;place-items:center;font-weight:800;text-decoration:none}

/* buttons / form */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 22px;border-radius:12px;border:2px solid var(--brand);background:var(--brand);color:#fff;font-weight:700;font-size:16px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn:disabled,.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed}
.btn-lime{background:var(--lime);border-color:var(--lime);color:var(--brand)}
.btn-lime:hover{background:var(--lime-d);border-color:var(--lime-d)}
.btn-ghost{background:#fff;color:var(--brand)}
.btn-ghost:hover{background:#EAF0EC;border-color:var(--brand)}
.btn-danger{background:#fff;color:#B3261E;border-color:#B3261E}
.btn-danger:hover{background:#FDECEA;border-color:#B3261E}
.btn.sm{height:40px;padding:0 16px;font-size:14px}
.btn.block{width:100%}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.inp{height:48px;width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;font-size:16px}
.inp:focus{border-color:var(--brand-2);outline:none;box-shadow:0 0 0 3px rgba(20,88,74,.18)}
.inp.bad{border-color:#B3261E}
.err{color:#B3261E;font-size:13px;font-weight:600;min-height:0}
.hint{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.inpgrp{display:flex}
.inpgrp>span{display:grid;place-items:center;padding:0 12px;background:#EEF2EF;border:1.5px solid var(--line);border-right:0;border-radius:12px 0 0 12px;font-weight:700;color:var(--muted)}
.inpgrp .inp{border-radius:0 12px 12px 0}
.seg{display:inline-flex;background:#E4EAE6;border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;height:38px;padding:0 18px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.radio{display:flex;gap:10px}
.radio label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:700;cursor:pointer}
.radio input{position:absolute;opacity:0}
.radio input:checked+span{color:var(--brand)}
.radio label:has(input:checked){border-color:var(--brand);background:#EAF3EE;box-shadow:inset 0 0 0 1px var(--brand)}
.radio label:has(input:focus-visible){outline:3px solid #6AA3FF}

/* hero */
.hero{background:var(--brand);color:#fff;padding:36px 0 84px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-120px;top:-80px;width:520px;height:520px;border-radius:50%;border:70px solid rgba(200,241,53,.07)}
.hero h1{font-size:clamp(30px,5.2vw,52px);font-weight:800;max-width:720px;position:relative;z-index:1}
.hero p{margin:14px 0 0;font-size:18px;color:#BFD3CC;max-width:560px;position:relative;z-index:1}
.sbox{position:relative;z-index:2;margin-top:-52px;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:18px}
.sbox .seg{margin-bottom:14px}
.srow{display:grid;grid-template-columns:1fr 44px 1fr 1fr auto;gap:12px;align-items:end}
.swap{width:44px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--brand)}
.swap:hover{background:#EAF3EE}
.chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:600;font-size:14px}
.chip:hover,.chip[aria-pressed=true]{border-color:var(--brand);background:#EAF3EE;color:var(--brand)}
.sec{padding:40px 0 0}
.sec h2{font-size:26px;font-weight:800}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
.pop{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pcard{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:var(--r);padding:18px;text-decoration:none;box-shadow:var(--shadow);border:2px solid transparent}
.pcard:hover{border-color:var(--brand)}
.pcard .r{font-weight:800;font-size:18px}
.pcard .r span{color:var(--lime-d)}
.pcard .m{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}
.pcard .p{font-weight:800;font-size:20px}
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:56px}
.feat div{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.feat b{display:block;margin-bottom:4px}

/* page */
.page{padding:28px 0 56px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:28px;font-weight:800}
.back{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:#fff;border:1.5px solid var(--line)}
.card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.day{flex:0 0 auto;min-width:76px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:center}
.day small{display:block;color:var(--muted);font-weight:600}
.day b{display:block}
.day[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.day[aria-pressed=true] small{color:#BFD3CC}
.trip{display:grid;grid-template-columns:1.1fr 1.3fr 1fr auto;gap:16px 24px;align-items:center;background:#fff;border-radius:var(--r);padding:18px 22px;box-shadow:var(--shadow);border:2px solid transparent}
.trip:hover{border-color:var(--lime-d)}
.tl{display:flex;align-items:center;gap:12px}
.tl .t{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.tl .line{flex:1;min-width:40px;text-align:center;font-size:12px;color:var(--muted);font-weight:600}
.tl .line i{display:block;height:2px;background:var(--line);margin:3px 0;position:relative}
.tl .line i::after{content:"";position:absolute;right:-1px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--brand)}
.trip .rt{font-weight:700}
.trip .meta{font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;background:#EEF2EF;color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.low{background:#FFE9D2;color:var(--warn)}
.pill.no{background:#F6DADA;color:#9A1C1C}
.price{font-size:22px;font-weight:800;white-space:nowrap}
.empty{text-align:center;padding:48px 20px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow)}
.empty h3{font-size:20px;margin-bottom:6px}
.empty p{margin:0 0 16px;color:var(--muted)}
.empty svg{color:var(--brand-2);margin-bottom:10px}

/* seats */
.two{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.sticky{position:sticky;top:84px}
.busbox{display:flex;flex-direction:column;align-items:center;gap:18px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 20px;font-size:13px;font-weight:600}
.legend i{display:inline-block;width:18px;height:18px;border-radius:5px;border:2px solid;vertical-align:-4px;margin-right:6px}
.bus{width:100%;max-width:330px;border:2px solid #C9D3CD;border-radius:34px 34px 16px 16px;padding:16px 18px 20px;background:#F8FAF8;display:flex;flex-direction:column;gap:10px}
.bus-f{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:2px dashed var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.bus-f .wheel{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;border:2px solid #C9D3CD;color:#7B8A84}
.brow{display:flex;justify-content:space-between;gap:12px}
.pair{display:flex;gap:8px}
.seat{width:50px;height:50px;border-radius:12px;font-weight:800;font-size:15px;border:2px solid var(--ok);background:#fff;color:var(--ok);position:relative;padding:0}
.seat:hover:not(:disabled){background:var(--ok-bg)}
.seat.sel{background:var(--lime);border-color:var(--brand);color:var(--brand)}
.seat.tm{background:var(--male);border-color:var(--male-b);color:#1E3F8A}
.seat.tf{background:var(--fem);border-color:var(--fem-b);color:#8A1745}
.seat.off{background:repeating-linear-gradient(135deg,#ECEFED 0 6px,#E2E6E4 6px 12px);border-color:#C3CCC7;color:#6B7873}
.seat:disabled{cursor:not-allowed}
.seat sup{position:absolute;top:1px;right:4px;font-size:11px;font-weight:700}
.sum-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum-row:last-child{border-bottom:0}
.sum-row b{font-variant-numeric:tabular-nums}
.sum-total{font-size:22px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--lime);color:var(--brand);font-weight:800;border-radius:8px;padding:2px 10px}

/* checkout */
.pass{display:flex;flex-direction:column;gap:14px}
.pass h3{display:flex;align-items:center;gap:10px;font-size:18px}
.pass h3 .tag{font-size:14px}
.timer{display:inline-flex;align-items:center;gap:8px;background:#FFF1D6;color:#7A4B00;border-radius:10px;padding:6px 12px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.timer.late{background:#F6DADA;color:#9A1C1C}
.demo{background:#FFF1D6;color:#6B4200;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--brand)}
.ok-mark{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center;margin:0 auto 14px;color:var(--ok)}
.ok-mark svg{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .6s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.ok-mark svg{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}

/* ticket */
.tk{display:grid;grid-template-columns:1fr 220px;background:#fff;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.tk-main{padding:24px;display:flex;flex-direction:column;gap:16px}
.tk-main .rt{font-size:26px;font-weight:800}
.tk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tk-grid div span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
.tk-grid div b{font-size:17px}
.tk-qr{border-left:2px dashed var(--line);padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:#FAFBFA}
.tk-qr img{width:100%;max-width:170px;height:auto}
.tk-st{display:inline-block;align-self:flex-start;border-radius:20px;padding:4px 12px;font-weight:700;font-size:13px}
.tk-st.active{background:var(--ok-bg);color:var(--ok)}
.tk-st.returned{background:#F6DADA;color:#9A1C1C}
.tk-st.past{background:#EEF2EF;color:var(--muted)}
.tcard{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#fff;border-radius:var(--r);padding:16px 20px;box-shadow:var(--shadow);text-decoration:none;border:2px solid transparent}
.tcard:hover{border-color:var(--brand)}
.tcard .rt{font-weight:800;font-size:18px}
.tcard .meta{font-size:14px;color:var(--muted)}

/* lists */
.menu{display:flex;flex-direction:column}
.menu a,.menu button{display:flex;align-items:center;gap:14px;padding:16px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-decoration:none;font-weight:600;font-size:16px;text-align:left;width:100%}
.menu a:last-child,.menu button:last-child{border-bottom:0}
.menu svg{color:var(--brand-2);flex:none}
.menu .chev{margin-left:auto;color:#9AA7A1}
.acc details{border-bottom:1px solid var(--line);padding:14px 0}
.acc summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.acc summary::after{content:"+";font-size:22px;line-height:1;color:var(--brand-2)}
.acc details[open] summary::after{content:"\2212"}
.acc p{margin:10px 0 0;color:var(--muted)}
.note{border-radius:12px;padding:12px 14px;background:#EAF3EE;color:#134D3E;font-size:14px;font-weight:600}
.note.warn{background:#FFF1D6;color:#6B4200}
.notif{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.notif:last-child{border-bottom:0}
.notif .ic{flex:none;width:40px;height:40px;border-radius:12px;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center}
.notif .ic.ret{background:#F6DADA;color:#9A1C1C}
.narrow{max-width:460px;margin:0 auto}
.center{text-align:center}
.link{color:var(--brand-2);font-weight:700;text-decoration:underline;background:none;border:0;padding:0}

/* footer, modal, toast, tabbar */
.foot{background:var(--brand);color:#BFD3CC;padding:26px 0}
.foot-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}
.foot strong{color:#fff;margin-right:12px}
.foot-links{display:flex;gap:18px}
.foot a{text-decoration:none}.foot a:hover{color:#fff}
.tabbar{display:none}
.toasts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(92vw,420px)}
.toast{background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow)}
.toast.err{background:#9A1C1C}.toast.ok{background:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(10,24,20,.55);display:grid;place-items:center;padding:16px;z-index:90}
.md{background:#fff;border-radius:20px;max-width:460px;width:100%;padding:24px;max-height:90vh;overflow:auto}
.md h3{font-size:21px;margin-bottom:10px}
.md p{margin:0 0 14px;color:var(--muted)}
.md .acts{display:flex;gap:10px;flex-wrap:wrap}
.md .acts .btn{flex:1}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brand);animation:spin .8s linear infinite;margin:60px auto}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:980px){
  .pop,.feat{grid-template-columns:repeat(2,1fr)}
  .two{grid-template-columns:1fr}.sticky{position:static}
  .srow{grid-template-columns:1fr 44px 1fr}
  .srow .field:nth-of-type(3){grid-column:1 / -1}
  .srow .btn{grid-column:1 / -1}
  .trip{grid-template-columns:1fr 1fr}
  .trip .go{grid-column:1 / -1}
}
@media (max-width:720px){
  .nav,.foot-links,.bell{display:none}
  .top-in{height:58px;gap:10px}
  .top-r{gap:8px}
  .lang{max-width:104px}
  .tabbar{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:12px;font-weight:700;color:var(--muted);text-decoration:none}
  .tabbar a.on{color:var(--brand)}
  body{padding-bottom:64px}
  .pop,.feat,.grid2{grid-template-columns:1fr}
  .trip{grid-template-columns:1fr;padding:16px}
  .tk{grid-template-columns:1fr}.tk-qr{border-left:0;border-top:2px dashed var(--line)}
  .tk-grid{grid-template-columns:1fr 1fr}
  .page-h h1{font-size:24px}
  .wrap{padding:0 16px}
}
@media print{
  .top,.foot,.tabbar,.toasts,.noprint,.back,.page-h{display:none!important}
  body{background:#fff;padding:0}
  .tk{box-shadow:none;border:2px solid #000}
  .page{padding:0}
}

</style>
</head>
<body>
<a class="skip" href="#app" data-i18n="skip">Asosiy qismga o'tish</a>

<header class="top" id="top">
  <div class="wrap top-in">
    <a class="brand" href="#/" aria-label="Bosh sahifa">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#C8F135"/><path d="M7 20V11a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v9z" fill="none" stroke="#0B3B31" stroke-width="2"/><path d="M7 15h18" stroke="#0B3B31" stroke-width="2"/><circle cx="11.5" cy="22" r="1.8" fill="#0B3B31"/><circle cx="20.5" cy="22" r="1.8" fill="#0B3B31"/></svg>
      <span id="brandName">Marshrut</span>
    </a>
    <nav class="nav" aria-label="Asosiy">
      <a href="#/" data-nav="home" data-i18n="nav.search">Qidiruv</a>
      <a href="#/tickets" data-nav="tickets" data-i18n="nav.tickets">Chiptalarim</a>
      <a href="#/faq" data-nav="faq" data-i18n="nav.faq">Savol-javob</a>
      <a href="#/contacts" data-nav="contacts" data-i18n="nav.contacts">Aloqa</a>
    </nav>
