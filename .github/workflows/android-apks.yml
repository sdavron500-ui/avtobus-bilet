name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apks.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build admin and customer APKs
        working-directory: android
        run: gradle --no-daemon assembleAdminDebug assembleClientDebug
      - uses: actions/upload-artifact@v4
        with:
          name: marshrut-android-apks
          path: |
            android/app/build/outputs/apk/admin/debug/app-admin-debug.apk
            android/app/build/outputs/apk/client/debug/app-client-debug.apk
          if-no-files-found: error
