plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.marshrut.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'uz.marshrut.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    flavorDimensions += 'role'
    productFlavors {
        admin {
            dimension 'role'
            applicationIdSuffix '.admin'
            resValue 'string', 'app_name', 'Marshrut Admin'
            buildConfigField 'String', 'APP_ROLE', '"admin"'
        }
        client {
            dimension 'role'
            applicationIdSuffix '.client'
            resValue 'string', 'app_name', 'Marshrut'
            buildConfigField 'String', 'APP_ROLE', '"client"'
        }
    }

    buildFeatures {
        buildConfig true
    }
}
